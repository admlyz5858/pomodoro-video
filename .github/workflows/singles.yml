name: Render Single-Style 50/10

on:
  workflow_dispatch: {}

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        style: [0, 1, 2, 3, 5, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure
      - name: Render style ${{ matrix.style }}
        run: |
          mkdir -p out
          npx remotion render PomodoroSingle "out/pomodoro-style-${{ matrix.style }}.mp4" \
            --props="{\"styleId\":${{ matrix.style }}}" --log=verbose
      - uses: actions/upload-artifact@v4
        with:
          name: pomodoro-style-${{ matrix.style }}
          path: out/pomodoro-style-${{ matrix.style }}.mp4
          retention-days: 14
          if-no-files-found: error
