name: Render Quote Clip

on:
  workflow_dispatch:
    inputs:
      clip:
        description: "Klip (q1=real6 eski, q2=real8 kafe, q3=real9 balkon)"
        type: choice
        options: ["q1", "q2", "q3"]

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      props: ${{ steps.mk.outputs.props }}
      chunks: ${{ steps.mk.outputs.chunks }}
    steps:
      - id: mk
        run: |
          CLIP="${{ inputs.clip }}"
          case "$CLIP" in
            q1) SRC=real6.mp4; LF=276;  SCRIM=0.42; AMB=rain; ACC="#efb56a";;
            q2) SRC=real8.mp4; LF=272;  SCRIM=0.42; AMB=rain; ACC="#e7c074";;
            q3) SRC=real9.mp4; LF=2124; SCRIM=0.40; AMB=rain; ACC="#94c8cf";;
          esac
          TOTAL=324570
          PROPS="{\"videoSrc\":\"$SRC\",\"videoLoopFrames\":$LF,\"videoScrim\":$SCRIM,\"ambientKey\":\"$AMB\",\"accentColor\":\"$ACC\"}"
          node -e "
            const t=$TOTAL, c=16200, a=[];
            for (let i=0, s=0; s<t; i++, s+=c) a.push({idx:i, frames: s+'-'+Math.min(s+c-1, t-1)});
            console.log('matrix='+JSON.stringify({include:a}));
            console.log('chunks='+a.length);
          " >> "$GITHUB_OUTPUT"
          echo "props=$PROPS" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure
      - name: Render chunk ${{ matrix.idx }} (${{ matrix.frames }})
        run: |
          mkdir -p out
          npx remotion render StudyQuote "out/chunk-${{ matrix.idx }}.mp4" \
            --frames=${{ matrix.frames }} \
            --props='${{ needs.plan.outputs.props }}' \
            --concurrency=2 --log=verbose
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.idx }}
          path: out/chunk-${{ matrix.idx }}.mp4
          retention-days: 7
          if-no-files-found: error

  merge:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          path: chunks
      - name: Concatenate
        run: |
          N=${{ needs.plan.outputs.chunks }}
          : > list.txt
          i=0
          while [ $i -lt $N ]; do
            echo "file 'chunks/chunk-$i/chunk-$i.mp4'" >> list.txt
            i=$((i+1))
          done
          cat list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy "quote-${{ inputs.clip }}.mp4"
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "quote-${{ inputs.clip }}.mp4" || true
          ls -la "quote-${{ inputs.clip }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: quote-${{ inputs.clip }}
          path: quote-${{ inputs.clip }}.mp4
          retention-days: 7
          if-no-files-found: error
