name: Render Stills

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Kompozisyon"
        type: string
        default: Pomodoro25

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure
      - name: Render stills
        run: |
          mkdir -p out
          npx remotion still ${{ inputs.composition }} out/01-intro.png --frame=90 --scale=0.6
          npx remotion still ${{ inputs.composition }} out/02-focus-start.png --frame=300 --scale=0.6
          npx remotion still ${{ inputs.composition }} out/03-focus-mid.png --frame=22650 --scale=0.6
          npx remotion still ${{ inputs.composition }} out/04-break-mid.png --frame=49500 --scale=0.6
          npx remotion still ${{ inputs.composition }} out/05-outro.png --frame=54220 --scale=0.6
      - uses: actions/upload-artifact@v4
        with:
          name: stills
          path: out/*.png
          retention-days: 14
          if-no-files-found: error
