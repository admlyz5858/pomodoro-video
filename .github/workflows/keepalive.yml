name: Keepalive

on:
  schedule:
    - cron: "0 12 * * 3"   # her Çarşamba 12:00 UTC — repo aktivitesi oluşturarak
                            # GitHub'ın 60 gün inaktivite sonrası cron'ları
                            # devre dışı bırakmasını engeller

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump keepalive timestamp
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/.keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/.keepalive
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
